# ============================
# ISIVI - Configuracion Spring Boot
# ============================
spring.application.name=isivi-app
# En desarrollo se carga application-local.properties automáticamente. La imagen de
# producción excluye ese archivo, por lo que conserva las variables obligatorias de este archivo.
spring.profiles.default=local
server.port=${PORT:8080}

# MongoDB - Atlas. La URI debe definirse mediante la variable de entorno MONGODB_URI.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/isivi}
spring.data.mongodb.auto-index-creation=true

#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017
#spring.data.mongodb.database=proyecto

# WhatsApp Cloud API (opcional). Al definir ambas variables, las confirmaciones se envían automáticamente.
isivi.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:${WHATSAPP_TOKEN:}}
isivi.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}

# Contraseña del administrador inicial (solo se usa si el usuario todavía no existe).
isivi.admin.initial-password=${ADMIN_INITIAL_PASSWORD:admin_ci_dummy_pass}

# ==============================
# WOMPI - PRODUCCIÓN
# ==============================
# Las claves se inyectan como variables de entorno del servidor. No se guardan
# aquí para evitar que credenciales de producción queden en Git.
isivi.wompi.public-key=${WOMPI_PUBLIC_KEY:}
isivi.wompi.private-key=${WOMPI_PRIVATE_KEY:}
isivi.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
isivi.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
isivi.wompi.base-url=${WOMPI_BASE_URL:https://production.wompi.co/v1}
isivi.wompi.redirect-url=${WOMPI_REDIRECT_URL:https://isivi-app.onrender.com/#pago}
isivi.wompi.sandbox=${WOMPI_SANDBOX:true}

# Duración de retención temporal para reservas en proceso de pago (en minutos)
isivi.reserva.pago-expiracion-minutos=${PAGO_EXPIRACION_MINUTOS:15}

# Margen mínimo de anticipación (en horas) para permitir cancelación automática directa al cliente
isivi.reserva.cancelacion-horas-minimas=${CANCELACION_HORAS_MINIMAS:24}

# Duración de retención para reservas en estado "Pendiente Comprobante" (en horas)
isivi.reserva.comprobante-expiracion-horas=${COMPROBANTE_EXPIRACION_HORAS:24}

# ==============================
# EMAIL TRANSACCIONAL - BREVO API (HTTPS :443)
# ==============================
isivi.brevo.api-key=${BREVO_API_KEY:}
isivi.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com/v3/smtp/email}
isivi.brevo.sender-name=${BREVO_SENDER_NAME:ISIVI}
app.mail.from=${MAIL_FROM:}
app.mail.enabled=${MAIL_ENABLED:false}

# Compatibilidad SMTP (secundaria / legado)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# SEGURIDAD - JWT
# ==============================
isivi.security.jwt-secret=${JWT_SECRET}
isivi.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# CLOUDINARY
# ==============================
isivi.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
isivi.cloudinary.api-key=${CLOUDINARY_API_KEY:}
isivi.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


